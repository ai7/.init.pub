# simple tmux configuration file
#
# ----- options -----

set -g prefix           C-a             # same as screen, easier to reach!
set -g base-index       1               # start window numbering at 1
set -g history-limit    60000           # default 2000

# use something in here: /usr/share/terminfo/
set -g terminal-overrides "tmux-256color"
# set -g default-terminal "screen-256color"

# 2. Enable mouse support (clicking, resizing, scrolling)
set -g mouse on

# allow shift-enter like combos to work in tmux
set -s extended-keys on

# ----- key bindings -----

bind r   source-file ~/.tmux.conf \; display "Reloaded"     # reload config file
bind m   set -g mouse \; display "Mouse: #{?mouse,ON,OFF}"  # toggle mouse

# split windows into panes
bind h   split-window                   # default '"'
bind v   split-window -h                # default '%'

# Shift arrow to switch windows
bind -n S-Left  previous-window        # default 'p'
bind -n S-Right next-window            # default 'n'

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ----- status bar settings -----

# Highlight active window with yellow
set -g window-status-current-style bg=yellow

# allocate chars for right side status.
# timestamp is 21 chars: [2015-08-18 17:15:54]
# load average is 25 chars: (0.06 0.03 0.05 12c/128g)
# uptime is 13 chars: 368d 00:38:48
# plus 2 space for total of 61 chars, using 60 (uptime < 100d || ram < 100g)
set -g status-right-length 60

# uptime, load-avg, iso-time
set -g status-right '#(~/.init.pub/tmux/uptime.sh) [%Y-%m-%d %H:%M:%S]'
